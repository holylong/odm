<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ODM</title>
<style>
  :root{--accent:#1f6feb;--line:#dfe3e8;--muted:#6b7280}
  *{box-sizing:border-box}
  body{
    margin:0;width:340px;font:12px/1.45 "Segoe UI",-apple-system,sans-serif;color:#1e2229;
    background:#fff;
  }
  header{
    display:flex;align-items:center;gap:8px;padding:10px 12px;
    background:linear-gradient(180deg,#fff,#f2f5f9);border-bottom:1px solid var(--line);
  }
  .logo{
    font-weight:700;font-size:14px;letter-spacing:.4px;
    background:linear-gradient(135deg,#1f6feb,#4dabf7);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .status{margin-left:auto;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .dot{width:7px;height:7px;border-radius:50%;background:#c92a2a}
  .dot.on{background:#2f9e44}
  section{padding:10px 12px;border-bottom:1px solid var(--line)}
  h4{margin:0 0 7px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
  .media{max-height:210px;overflow:auto;margin:0 -4px}
  .m{
    display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:5px;cursor:pointer;
  }
  .m:hover{background:#eef4fe}
  .m .kind{font-size:11px;opacity:.7;width:14px;text-align:center;flex:0 0 auto}
  .m .url{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#374151}
  .m button{
    border:1px solid var(--line);background:#fff;border-radius:4px;padding:2px 8px;
    font-size:10.5px;cursor:pointer;color:var(--accent);font-weight:600;
  }
  .m button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .empty{color:var(--muted);font-size:11px;padding:6px 2px}
  .row{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:11.5px}
  .switch{position:relative;width:34px;height:18px;flex:0 0 auto}
  .switch input{opacity:0;width:0;height:0}
  .slider{
    position:absolute;inset:0;background:#cbd5e1;border-radius:10px;transition:.15s;cursor:pointer;
  }
  .slider:before{
    content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;background:#fff;
    border-radius:50%;transition:.15s;
  }
  .switch input:checked + .slider{background:var(--accent)}
  .switch input:checked + .slider:before{transform:translateX(16px)}
  .urlbox{display:flex;gap:6px}
  .urlbox input{
    flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:5px;font:inherit;font-size:11px;
    outline:none;min-width:0;
  }
  .urlbox input:focus{border-color:var(--accent)}
  .urlbox button{
    padding:6px 12px;border:1px solid var(--accent);background:var(--accent);color:#fff;
    border-radius:5px;font-weight:600;font-size:11px;cursor:pointer;
  }
  .urlbox button:hover{background:#1657bd}
  .note{padding:8px 12px;font-size:10.5px;color:var(--muted);line-height:1.5}
  .note code{background:#eef1f5;padding:1px 4px;border-radius:3px;font-size:10px}
</style>
</head>
<body>
<header>
  <span class="logo">ODM</span>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText">checking…</span></span>
</header>

<section>
  <div class="row">
    <span>Take over downloads</span>
    <label class="switch"><input type="checkbox" id="enabled" checked><span class="slider"></span></label>
  </div>
</section>

<section>
  <h4>Download a link</h4>
  <div class="urlbox">
    <input id="url" type="text" placeholder="https://…">
    <button id="send">Send</button>
  </div>
</section>

<section>
  <h4>Media on this page</h4>
  <div class="media" id="media"><div class="empty">Scanning…</div></div>
</section>

<div class="note" id="note">
  Extension talks to <code>com.odm.host</code> first, then the loopback bridge.
</div>

<script src="popup.js"></script>
</body>
</html>
